<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="Suhyeong Park’s research, publications, and blog.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' https: data:; base-uri 'none'; object-src 'none'; form-action 'none'">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}Suhyeong Park</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/blog.css' | relative_url }}">
  <script src="{{ '/script.js' | relative_url }}" defer></script>
  <script type="module" src="{{ '/blog.js' | relative_url }}"></script>
  <script src="{{ '/publication-editor.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% assign current_nav = page.nav | default: 'blog' %}
  <header class="site-header shell">
    <a class="site-name" href="{{ '/' | relative_url }}">Suhyeong Park<span aria-hidden="true">.</span></a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}"{% if current_nav == 'home' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/publications/' | relative_url }}"{% if current_nav == 'publications' %} aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/blog/' | relative_url }}"{% if current_nav == 'blog' %} aria-current="{% if page.url == '/blog/' %}page{% else %}location{% endif %}"{% endif %}>Blog</a>
    </nav>
  </header>
  <main class="shell site-main" id="main">
    {{ content }}
  </main>
  <footer class="site-footer shell">
    <p>© {{ site.time | date: '%Y' }} Suhyeong Park</p>
    <a href="mailto:pshpulip22@catholic.ac.kr">Email <span aria-hidden="true">↗</span></a>
  </footer>
  {% include site-admin.html %}
  {% include blog-editor.html %}
  {% include publication-editor.html %}
</body>
</html>
