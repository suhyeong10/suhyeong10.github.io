<dialog id="blog-editor" class="editor-dialog blog-editor" aria-labelledby="blog-editor-title">
  <div class="editor-heading blog-editor-heading">
    <h2 id="blog-editor-title">New blog post</h2>
    <button class="blog-editor-close" type="button" aria-label="Close editor" data-blog-close>×</button>
  </div>
  <form id="blog-form" method="dialog">
    <fieldset data-blog-fields>
      <label for="blog-title-input">Title</label>
      <input id="blog-title-input" name="title" required maxlength="160" autofocus>

      <div class="blog-editor-columns">
        <div>
          <label for="blog-markdown">Markdown</label>
          <textarea id="blog-markdown" name="markdown" required maxlength="100000" rows="11" placeholder="Start writing…"></textarea>
        </div>
        <div>
          <h3 id="blog-preview-heading">Preview</h3>
          <div id="blog-preview" class="blog-editor-preview prose" role="region" aria-labelledby="blog-preview-heading" tabindex="0"></div>
        </div>
      </div>

      <div class="blog-editor-actions">
        <p data-blog-draft></p>
        <button class="button button-primary blog-editor-publish" type="submit">Publish</button>
      </div>
    </fieldset>
    <p class="editor-status blog-editor-status" role="status" data-blog-status></p>
    <a data-blog-view hidden>Open post</a>
  </form>
</dialog>
