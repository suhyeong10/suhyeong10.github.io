<a class="project-card" href="{{ include.href | escape }}">
  {% if include.figure %}
    <div class="project-card-media">
      <img src="{{ include.figure | relative_url }}" alt="" loading="lazy" decoding="async">
    </div>
  {% endif %}
  {% if include.venue or include.year %}
    <p class="eyebrow">{{ include.venue | escape }}{% if include.venue and include.year %} · {% endif %}{{ include.year }}</p>
  {% endif %}
  <h3>{{ include.title | escape }} <span aria-hidden="true">↗</span></h3>
  {% if include.summary %}<p>{{ include.summary | escape }}</p>{% endif %}
</a>
