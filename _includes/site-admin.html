<div class="site-admin">
  <div class="admin-options" id="admin-options" hidden>
    <a href="{{ '/write/blog/' | relative_url }}">New blog post</a>
    <a href="{{ '/write/publication/' | relative_url }}">Add publication</a>
    <a href="{{ '/write/update/' | relative_url }}">Add update</a>
    {% if page.nav == 'cv' %}<a href="{{ '/cv/#cv-sign-in' | relative_url }}" id="cv-sign-in-link">Sign in to edit CV</a>{% endif %}
    <button type="button" id="admin-sign-out" hidden>Sign out of editor</button>
  </div>
  <button type="button" class="admin-toggle" id="admin-toggle" aria-label="Add site content" aria-controls="admin-options" aria-expanded="false">
    <span aria-hidden="true"></span>
  </button>
</div>
