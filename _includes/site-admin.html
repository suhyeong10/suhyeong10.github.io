<div class="site-admin">
  <div class="admin-options" id="admin-options" hidden>
    <button type="button" data-admin-action="open-blog-editor">New blog post</button>
    <button type="button" data-admin-action="open-publication-editor">Add publication</button>
    <button type="button" id="admin-sign-out" hidden>Sign out of editor</button>
  </div>
  <button type="button" class="admin-toggle" id="admin-toggle" aria-label="Add site content" aria-controls="admin-options" aria-expanded="false">
    <span aria-hidden="true"></span>
  </button>
</div>
<dialog id="admin-auth" class="editor-dialog auth-dialog" aria-labelledby="auth-title">
  <form id="admin-auth-form" class="editor-form" autocomplete="off">
    <div class="editor-heading">
      <h2 id="auth-title">Connect GitHub</h2>
      <button type="button" class="button" id="admin-cancel" aria-label="Close GitHub authentication">Close</button>
    </div>
    <p>Site editing is available to <strong>@suhyeong10</strong>.</p>
    <label class="editor-field">
      <span>Fine-grained access token</span>
      <input id="admin-token" type="password" placeholder="github_pat_…" required spellcheck="false" autocapitalize="off" autocomplete="off" aria-describedby="auth-hint">
    </label>
    <p id="auth-hint" class="field-help"><a href="https://github.com/settings/personal-access-tokens/new?name=Website+editor&amp;target_name=suhyeong10&amp;expires_in=30&amp;contents=write" target="_blank" rel="noopener noreferrer">Create a token on GitHub <span aria-hidden="true">↗</span></a> for <strong>suhyeong10.github.io</strong> with <strong>Contents → Read and write</strong>. The editor keeps it in memory until you sign out or leave this page.</p>
    <div class="editor-actions">
      <p class="editor-status" id="auth-status" role="status" aria-live="polite"></p>
      <button type="submit" class="button button-primary" id="admin-connect">Verify GitHub account</button>
    </div>
  </form>
</dialog>
